# List of vulnerabilities ignored by govulncheck.
# Each entry requires an ID and an explanation for why it is safe to ignore.
# Entries should be removed once upstream advisories or dependencies are updated.

- id: GO-2026-6568
  module: github.com/gardener/gardener
  reason: >-
    Upstream vulndb bug (GHSA-gfjv-gqf2-c888 / CVE-2026-79767): the advisory was
    ingested into vuln.go.dev with non_go_versions, which caused the generated
    SEMVER range to default to >= 0 without an upper bound. The fix was released
    in Gardener v1.145.0 and this repository uses v1.152.0, so the codebase is not
    vulnerable (see https://github.com/golang/vulndb/issues/6666).
