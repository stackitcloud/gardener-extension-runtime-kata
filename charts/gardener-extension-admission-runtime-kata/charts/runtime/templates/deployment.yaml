apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "labels" . | nindent 4 }}
    high-availability-config.resources.gardener.cloud/type: server
spec:
  revisionHistoryLimit: 5
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{ include "selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.kubeconfig }}
        checksum/gardener-extension-admission-runtime-kata-kubeconfig: {{ include (print $.Template.BasePath "/secret-kubeconfig.yaml") . | sha256sum }}
        {{- end }}
      labels:
        networking.gardener.cloud/to-dns: allowed
        networking.resources.gardener.cloud/to-virtual-garden-kube-apiserver-tcp-443: allowed
        networking.gardener.cloud/to-runtime-apiserver: allowed
        {{ include "labels" . | nindent 8 }}
    spec:
      {{- if .Values.gardener.runtimeCluster.priorityClassName }}
      priorityClassName: {{ .Values.gardener.runtimeCluster.priorityClassName }}
      {{- end }}
      serviceAccountName: {{ include "fullname" . }}
      {{- if .Values.kubeconfig }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
      - name: admission-runtime-kata
        image: {{ include "image" .Values.image }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --webhook-config-server-port={{ .Values.webhookConfig.serverPort }}
        - --webhook-config-service-port={{ .Values.webhookConfig.servicePort }}
        {{- if .Values.gardener.virtualCluster.enabled }}
        - --webhook-config-mode=url
        - --webhook-config-url={{ printf "%s.%s" (include "fullname" .) (.Release.Namespace) }}
        {{- else }}
        - --webhook-config-mode=service
        {{- end }}
        - --webhook-config-namespace={{ .Release.Namespace }}
        {{- if .Values.gardener.virtualCluster.namespace }}
        - --webhook-config-owner-namespace={{ .Values.gardener.virtualCluster.namespace }}
        {{- end }}
        {{- if .Values.kubeconfig }}
        - --kubeconfig=/etc/gardener-extension-admission-runtime-kata/kubeconfig/kubeconfig
        {{- end }}
        {{- if .Values.projectedKubeconfig }}
        - --kubeconfig={{ required ".Values.projectedKubeconfig.baseMountPath is required" .Values.projectedKubeconfig.baseMountPath }}/kubeconfig
        {{- end }}
        {{- if .Values.metricsPort }}
        - --metrics-bind-address=:{{ .Values.metricsPort }}
        {{- end }}
        {{- if kindIs "slice" .Values.requiredCapabilities }}
        {{- range .Values.requiredCapabilities }}
        - --required-capability={{ .name }}={{ .value }}
        {{- end }}
        {{- else if kindIs "map" .Values.requiredCapabilities }}
        {{- range $key, $val := .Values.requiredCapabilities }}
        - --required-capability={{ $key }}={{ $val }}
        {{- end }}
        {{- end }}
        - --health-bind-address=:{{ .Values.healthPort }}
        - --leader-election-id=gardener-extension-admission-runtime-kata
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.healthPort }}
            scheme: HTTP
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.healthPort }}
            scheme: HTTP
          initialDelaySeconds: 5
        env:
        - name: LEADER_ELECTION_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.extraEnvs }}
        {{- toYaml .Values.extraEnvs | nindent 8}}
        {{- end }}
        {{- if .Values.gardener.virtualCluster.enabled }}
        - name: SOURCE_CLUSTER
          value: enabled
        {{- end }}
        ports:
        - name: webhook-server
          containerPort: {{ .Values.webhookConfig.serverPort }}
          protocol: TCP
        {{- if .Values.metricsPort }}
        - name: metrics
          containerPort: {{ .Values.metricsPort }}
          protocol: TCP
        {{- end }}
        {{- if or .Values.kubeconfig .Values.projectedKubeconfig }}
        volumeMounts:
        {{- if .Values.kubeconfig }}
        - name: gardener-extension-admission-runtime-kata-kubeconfig
          mountPath: /etc/gardener-extension-admission-runtime-kata/kubeconfig
          readOnly: true
        {{- end }}
        {{- if .Values.projectedKubeconfig }}
        - name: kubeconfig
          mountPath: {{ .Values.projectedKubeconfig.baseMountPath }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if .Values.resources }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        {{- end }}
      {{- if or .Values.kubeconfig .Values.projectedKubeconfig }}
      volumes:
      {{- if .Values.kubeconfig }}
      - name: gardener-extension-admission-runtime-kata-kubeconfig
        secret:
          secretName: gardener-extension-admission-runtime-kata-kubeconfig
      {{- end }}
      {{- if .Values.projectedKubeconfig }}
      - name: kubeconfig
        projected:
          defaultMode: 420
          sources:
          - secret:
              items:
              - key: kubeconfig
                path: kubeconfig
              name: {{ .Values.projectedKubeconfig.genericKubeconfigSecretName }}
              optional: false
          - secret:
              items:
              - key: token
                path: token
              name: {{ .Values.projectedKubeconfig.tokenSecretName }}
              optional: false
      {{- end }}
      {{- end }}
