---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fullname" . }}
  labels:
    {{ include "labels" . | nindent 4 }}
rules:
  - apiGroups:
      - core.gardener.cloud
    resources:
      - cloudprofiles
      - namespacedcloudprofiles
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
    verbs:
      - create
      - get
      - list
      - watch
  # Write access is restricted to the ValidatingWebhookConfiguration created by this
  # admission component ("gardener-extension-" + AdmissionName, i.e. the name computed
  # by extensionswebhook.PrefixedName with providerName "admission-runtime-kata").
  # Note: when deployed with --webhook-config-namespace starting with
  # "runtime-extension-", Gardener appends a "-runtime" suffix to the configuration
  # name (see extensions/pkg/webhook/cmd.NewAddToManagerOptions) and this
  # resourceName must be adapted accordingly.
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
    resourceNames:
    - gardener-extension-admission-runtime-kata
    verbs:
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fullname" . }}
  labels:
    {{ include "labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fullname" . }}
subjects:
{{- if .Values.gardener.virtualCluster.serviceAccount.name }}
  - kind: ServiceAccount
    name: {{ required ".Values.gardener.virtualCluster.serviceAccount.name is required" .Values.gardener.virtualCluster.serviceAccount.name }}
    namespace: {{ required ".Values.gardener.virtualCluster.serviceAccount.namespace is required" .Values.gardener.virtualCluster.serviceAccount.namespace }}
{{- else }}
  - kind: ServiceAccount
    name: {{ include "fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
